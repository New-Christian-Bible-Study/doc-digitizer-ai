name: Build Review Chunk Executable

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - review-chunk-exe
    paths:
      - 'prompt-based/**'
      - 'requirements.txt'
      - '.github/workflows/review-chunk-executable.yml'
  pull_request:
    paths:
      - 'prompt-based/**'
      - 'requirements.txt'
      - '.github/workflows/review-chunk-executable.yml'

jobs:
  build-review-chunk:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean prompt-based/review-chunk.spec

      - name: Smoke test executable help output
        run: python prompt-based/ci/smoke-review-chunk-exe.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: review-chunk-${{ matrix.os }}
          path: |
            dist/review-chunk
            dist/review-chunk.exe
            build/review-chunk/warn-review-chunk.txt
          if-no-files-found: error

